<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="NEON//GRID">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a1a"/>
      <stop offset="1" stop-color="#0a0e0a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" y="3" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <clipPath id="floor"><rect x="0" y="196" width="1200" height="104"/></clipPath>
  </defs>

  <rect width="1200" height="300" rx="10" fill="url(#bg)"/>

  <!-- perspective floor -->
  <g clip-path="url(#floor)" stroke="#00ff9c" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="600" y1="196" x2="-600" y2="300"/><line x1="600" y1="196" x2="-300" y2="300"/>
    <line x1="600" y1="196" x2="0" y2="300"/><line x1="600" y1="196" x2="200" y2="300"/>
    <line x1="600" y1="196" x2="400" y2="300"/><line x1="600" y1="196" x2="600" y2="300"/>
    <line x1="600" y1="196" x2="800" y2="300"/><line x1="600" y1="196" x2="1000" y2="300"/>
    <line x1="600" y1="196" x2="1200" y2="300"/><line x1="600" y1="196" x2="1500" y2="300"/>
    <line x1="600" y1="196" x2="1800" y2="300"/>
    <g stroke="#39ff14">
      <line x1="0" y1="202" x2="1200" y2="202" stroke-opacity="0.25"/>
      <line x1="0" y1="212" x2="1200" y2="212" stroke-opacity="0.35"/>
      <line x1="0" y1="228" x2="1200" y2="228" stroke-opacity="0.45"/>
      <line x1="0" y1="250" x2="1200" y2="250" stroke-opacity="0.55"/>
      <line x1="0" y1="280" x2="1200" y2="280" stroke-opacity="0.7"/>
    </g>
  </g>
  <line x1="0" y1="196" x2="1200" y2="196" stroke="#b8ffdf" stroke-width="2" filter="url(#soft)"/>
  <line x1="0" y1="196" x2="1200" y2="196" stroke="#b8ffdf" stroke-width="1.5"/>

  <!-- segmented sun -->
  <g stroke="#00ff9c" fill="none" opacity="0.35">
    <path d="M 500 196 A 100 100 0 0 1 700 196" stroke-width="3"/>
    <line x1="512" y1="150" x2="688" y2="150"/><line x1="503" y1="168" x2="697" y2="168"/>
    <line x1="501" y1="184" x2="699" y2="184"/><line x1="530" y1="126" x2="670" y2="126"/>
  </g>

  <!-- HUD brackets -->
  <g stroke="#00ff9c" stroke-width="3" fill="none">
    <polyline points="30,70 30,30 70,30"/><polyline points="1130,30 1170,30 1170,70"/>
    <polyline points="30,230 30,270 70,270"/><polyline points="1170,230 1170,270 1130,270"/>
  </g>

  <!-- title -->
  <text x="600" y="128" text-anchor="middle" filter="url(#glow)"
        font-family="'JetBrains Mono','JetBrainsMono Nerd Font',Consolas,'DejaVu Sans Mono',monospace"
        font-size="96" font-weight="800" letter-spacing="6" fill="#00ff9c">NEON<tspan fill="#39ff14">//</tspan>GRID</text>
  <text x="600" y="172" text-anchor="middle"
        font-family="'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace"
        font-size="20" letter-spacing="4" fill="#b8ffdf" fill-opacity="0.85">kali://bspwm  ::  sys.online  ::  trace.active</text>

  <rect width="1200" height="300" rx="10" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="298" rx="10" fill="none" stroke="#1f7a4d" stroke-width="2"/>
</svg>
